<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8fa">
  <meta name="description" content="桜香予約システムの操作マニュアル。予約対応、詳細管理、メール、LINE、サイト編集、SEO、シフト画像、更新手順をスマホで確認できます。">
  <title>桜香予約システム 操作マニュアル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" aria-label="ページ上部へ">
        <span class="brand-mark">OUKA</span>
        <span>操作マニュアル</span>
      </a>
      <button id="openNav" class="icon-button" type="button" aria-label="目次を開く">☰</button>
    </div>
  </header>

  <main id="top" class="page-shell">
    <section class="hero card-soft">
      <p class="eyebrow" id="manualSubtitle"></p>
      <h1 id="manualTitle"></h1>
      <p class="hero-intro" id="manualIntro"></p>
      <p class="updated" id="manualUpdated"></p>
    </section>

    <section class="quick-links" id="quickLinks" aria-label="よく使うリンク"></section>

    <section class="search-card card-soft">
      <label for="manualSearch">マニュアル内を検索</label>
      <div class="search-row">
        <span aria-hidden="true">⌕</span>
        <input id="manualSearch" type="search" placeholder="例：キャンセル、LINE、背景、デプロイ" autocomplete="off">
        <button id="clearSearch" type="button" hidden>クリア</button>
      </div>
      <p class="search-status" id="searchStatus" aria-live="polite"></p>
    </section>

    <section class="section-heading">
      <p class="eyebrow">MANUAL</p>
      <h2>何をしたいですか？</h2>
      <p>カテゴリーをタップすると、その中の操作だけ確認できます。</p>
    </section>

    <div id="manualRoot" class="manual-root"></div>

    <footer class="footer">
      <strong>桜香予約システム</strong>
      <span>操作マニュアル</span>
      <small>本文は <code>manual-data.js</code> から編集できます。</small>
    </footer>
  </main>

  <button id="backToTop" class="back-to-top" type="button" aria-label="ページ上部へ戻る">↑</button>

  <div id="navBackdrop" class="nav-backdrop" hidden></div>
  <aside id="navDrawer" class="nav-drawer" aria-hidden="true">
    <div class="nav-head">
      <div>
        <span class="eyebrow">CONTENTS</span>
        <strong>目次</strong>
      </div>
      <button id="closeNav" class="icon-button" type="button" aria-label="目次を閉じる">×</button>
    </div>
    <nav id="navList"></nav>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="manual-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
